apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-cicd
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-cicd
  template:
    metadata:
      labels:
        app: nginx-cicd
    spec:
      containers:
        - name: nginx
          image: pratheekmr/nginx-cicd:2
          ports:
            - containerPort: 80
